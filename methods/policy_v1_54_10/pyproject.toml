[project]
name = "dsdg-supply-chain"
version = "0.1.0"
description = "Forecasting and ordering pipeline for the DSDG 2026 Supply Chain Disruptor competition"
authors = [
    { email = "shubeeksh26@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "kaggle>=2.0",
    "matplotlib>=3.7",
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.3",
    "scipy>=1.11",
    "six>=1.17.0",
]

[project.scripts]
dsdg = "dsdg_supply_chain.cli:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
